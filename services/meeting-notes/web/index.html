<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Конспект встречи</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 680px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
      h1 { font-size: 1.5rem; }
      textarea, button { font-size: 1rem; padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; width: 100%; font-family: inherit; }
      textarea { min-height: 200px; }
      button { cursor: pointer; background: #111; color: #fff; border: none; margin-top: 0.5rem; }
      #status { margin-top: 1rem; color: #666; }
      #error { margin-top: 0.5rem; color: #c00; }
      a { color: #06c; }
    </style>
  </head>
  <body>
    <h1>Конспект встречи</h1>
    <p>Вставьте стенограмму или заметки — агент оформит конспект (решения, задачи, вопросы) и соберёт его в страницу.</p>
    <textarea id="transcript" placeholder="Вставьте текст встречи…"></textarea>
    <button id="go">Разобрать и оформить</button>
    <div id="status"></div>
    <div id="error"></div>
    <div id="result"></div>
    <script>
      const $ = (id) => document.getElementById(id);
      let timer = null;
      $("go").addEventListener("click", async () => {
        const transcript = $("transcript").value.trim();
        if (!transcript) { $("error").textContent = "Вставьте текст встречи"; return; }
        $("error").textContent = ""; $("result").innerHTML = ""; $("status").textContent = "Запускаю…";
        const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ transcript }) });
        const data = await res.json();
        if (!data.ok) { $("error").textContent = data.error || "Ошибка запуска"; return; }
        clearInterval(timer); timer = setInterval(poll, 3000); poll();
      });
      async function poll() {
        const s = await (await fetch("/api/status")).json();
        $("status").textContent = "Статус: " + s.status;
        if (s.status === "running") return;
        clearInterval(timer);
        if (s.status === "error") { $("error").textContent = "Ошибка выполнения"; return; }
        const r = await (await fetch("/api/result")).json();
        $("result").innerHTML = "Готово: " + (r.sections || []).length + " разделов. " + '<a href="' + r.site_url + '" target="_blank">Открыть конспект</a>';
      }
    </script>
  </body>
</html>
